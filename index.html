<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Flat Order</title>
<style>
  :root {
    --bg: #f7f8f8;
    --surface: #ffffff;
    --border: #e4e9eb;
    --border-dark: #c8d8e4;
    --text: #1a2e35;
    --text-soft: #6b8f9a;
    --accent: #52ab98;
    --accent-hover: #2b6777;
    --nav-bg: #2b6777;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow Condensed', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; letter-spacing: 0.01em; }

  /* NAV */
  nav { background: var(--nav-bg); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 60px; position: sticky; top: 0; z-index: 100; }
  nav .logo { font-weight: 500; font-size: 18px; display:flex; align-items:center; }
  nav .nav-right { display: flex; align-items: center; gap: 6px; }
  nav button { background: transparent; color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; font-family: inherit; transition: all 0.2s; }
  nav button.active { background: rgba(255,255,255,0.18); color: white; border-color: rgba(255,255,255,0.35); }
  nav button:hover { background: rgba(255,255,255,0.12); color: white; }
  .cart-badge { background: var(--accent); color: white; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 500; margin-left: 4px; }
  .user-pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: 5px 14px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .user-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: white; }
  @media (max-width: 640px) {
    nav { flex-direction: column; height: auto; padding: 10px 14px; gap: 8px; }
    nav .nav-right { flex-wrap: wrap; justify-content: center; gap: 5px; width: 100%; }
    nav .nav-right button { font-size: 11px; padding: 5px 8px; }
    nav .user-pill { font-size: 11px; }
  }

  /* AUTH */
  #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #eef4f5 0%, #e2eef0 100%); }
  .auth-box { background: #fff; border-radius: 16px; padding: 44px 40px; max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(43,103,119,0.10); }
  .auth-logo { text-align: center; margin-bottom: 20px; }
  .auth-title { text-align: center; font-size: 24px; font-weight: 500; margin-bottom: 4px; color: var(--nav-bg); letter-spacing: 0.06em; }
  .auth-sub { text-align: center; color: var(--text-soft); font-size: 13px; margin-bottom: 28px; }
  .auth-tabs { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 24px; gap: 2px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-soft); transition: all 0.2s; }
  .auth-tab.active { background: var(--nav-bg); color: white; box-shadow: 0 2px 8px rgba(43,103,119,0.2); }
  .auth-input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-bottom: 10px; font-family: inherit; transition: border-color 0.2s; background: #fafbfb; color: var(--text); }
  .auth-input:focus { outline: none; border-color: var(--nav-bg); background: white; }
  .auth-btn { width: 100%; background: var(--nav-bg); color: white; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 12px; font-family: inherit; transition: background 0.2s; }
  .auth-btn:hover { background: var(--accent-hover); }
  .auth-divider { text-align: center; color: var(--text-soft); font-size: 12px; margin: 10px 0; }
  .google-btn { width: 100%; background: #fff; color: var(--text); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; transition: border-color 0.2s; }
  .google-btn:hover { border-color: var(--border-dark); background: var(--bg); }
  .auth-err { color: #e05252; font-size: 13px; margin-bottom: 10px; display: none; text-align: center; background: #fef2f2; border-radius: 6px; padding: 8px 12px; }
  .auth-info { background: #f0fdf9; border: 1px solid #a7f3d0; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #065f46; margin-bottom: 12px; display: none; }

  /* APP */
  #app { display: none; }
  .view { display: none; padding: 32px 28px; max-width: 1160px; margin: 0 auto; }
  .view.active { display: block; }
  @media (max-width: 640px) {
    .view { padding: 14px 12px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .form-grid { grid-template-columns: 1fr; }
    .admin-tabs { flex-wrap: wrap; }
    .cart-item { flex-wrap: wrap; gap: 8px; }
    .filter-row { flex-wrap: wrap; }
    table { font-size: 11px; }
    table td, table th { padding: 5px 6px; }
  }

  /* CATALOG */
  .cat-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .cat-btn { border: 1.5px solid var(--border); background: var(--surface); border-radius: 6px; padding: 7px 18px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 500; color: var(--text-soft); transition: all 0.18s; }
  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cat-btn.active { border-color: var(--nav-bg); background: var(--nav-bg); color: white; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
  @media (max-width: 640px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

  /* PRODUCT CARD */
  .product-card { background: var(--surface); border-radius: 12px; padding: 20px 16px; position: relative; border: 1.5px solid var(--border); transition: box-shadow 0.2s, border-color 0.2s; }
  .product-card:hover { box-shadow: 0 4px 20px rgba(43,103,119,0.10); border-color: var(--border-dark); }
  .product-card.out-of-stock { opacity: 0.55; }
  .product-emoji { font-size: 32px; margin-bottom: 10px; }
  .product-name { font-size: 15px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
  .product-cat { font-size: 11px; color: var(--text-soft); margin-bottom: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .product-price { font-size: 18px; font-weight: 500; color: var(--nav-bg); margin-bottom: 12px; }
  .stock-badge { position: absolute; top: 12px; right: 12px; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
  .stock-badge.out { background: #fef2f2; color: #dc2626; }
  .stock-badge.low { background: #fef9ee; color: #d97706; }
  .add-to-cart { width: 100%; background: var(--nav-bg); color: white; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.2s; }
  .add-to-cart:hover { background: var(--accent-hover); }
  .add-to-cart:disabled { background: #ddd; color: #aaa; cursor: not-allowed; }
  .qty-control { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: 8px; padding: 4px 6px; }
  .qty-btn { width: 30px; height: 30px; border-radius: 6px; border: none; background: var(--surface); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text); transition: background 0.15s; }
  .qty-btn:hover { background: var(--border-dark); }
  .qty-num { font-weight: 500; font-size: 15px; color: var(--text); min-width: 24px; text-align: center; }

  /* CART */
  .cart-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .cart-item-emoji { font-size: 28px; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 15px; font-weight: 500; }
  .cart-item-price { font-size: 13px; color: var(--text-soft); margin-top: 2px; }
  .cart-item-controls { display: flex; align-items: center; gap: 8px; }
  .cart-qty-btn { width: 28px; height: 28px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text); }
  .cart-qty-btn:hover { border-color: var(--accent); }
  .cart-qty-num { font-weight: 500; min-width: 20px; text-align: center; }
  .cart-item-total { font-size: 15px; font-weight: 500; color: var(--nav-bg); min-width: 70px; text-align: right; }
  .summary-box { background: var(--surface); border-radius: 12px; padding: 20px; border: 1.5px solid var(--border); margin-top: 16px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .summary-total { font-size: 18px; font-weight: 500; color: var(--nav-bg); border-top: 2px solid var(--border); padding-top: 12px; margin-top: 8px; }
  .order-input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 14px; font-size: 14px; font-family: inherit; margin-bottom: 10px; background: #fafbfb; transition: border-color 0.2s; }
  .order-input:focus { outline: none; border-color: var(--nav-bg); background: white; }
  .submit-order-btn { width: 100%; background: var(--accent); color: white; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: 500; cursor: pointer; font-family: inherit; letter-spacing: 0.04em; transition: background 0.2s; }
  .submit-order-btn:hover { background: var(--accent-hover); }

  /* MY ORDERS */
  .my-order-card { background: var(--surface); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; border: 1.5px solid var(--border); }
  .my-order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .my-order-num { font-weight: 500; font-size: 15px; color: var(--nav-bg); }
  .my-order-date { font-size: 12px; color: var(--text-soft); }
  .my-order-items { font-size: 13px; color: var(--text-soft); margin-bottom: 10px; line-height: 1.6; }
  .my-order-total { font-weight: 500; font-size: 16px; color: var(--nav-bg); }

  /* ADMIN TABS */
  .admin-tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid var(--border); padding-bottom: 0; flex-wrap: wrap; }
  .admin-tab { background: transparent; border: none; padding: 10px 18px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-soft); font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.18s; }
  .admin-tab.active { color: var(--nav-bg); border-bottom-color: var(--nav-bg); }
  .admin-tab:hover { color: var(--nav-bg); }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border-radius: 10px; padding: 18px 16px; border: 1.5px solid var(--border); }
  .stat-num { font-size: 26px; font-weight: 500; color: var(--nav-bg); line-height: 1; }
  .stat-label { font-size: 12px; color: var(--text-soft); margin-top: 4px; letter-spacing: 0.04em; }

  /* ORDER CARDS */
  .order-card { background: var(--surface); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; border-left: 4px solid var(--border); border-top: 1.5px solid var(--border); border-right: 1.5px solid var(--border); border-bottom: 1.5px solid var(--border); }
  .order-card.bekliyor { border-left-color: #f59e0b; }
  .order-card.hazirlaniyor { border-left-color: #3b82f6; }
  .order-card.tamamlandi { border-left-color: #22c55e; }
  .order-card.iptal { border-left-color: #ef4444; }
  .order-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .order-num { font-weight: 500; font-size: 15px; color: var(--nav-bg); }
  .order-date { font-size: 12px; color: var(--text-soft); }
  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; margin-left: 8px; }
  .badge-bekliyor { background: #fef3c7; color: #92400e; }
  .badge-hazirlaniyor { background: #dbeafe; color: #1e40af; }
  .badge-tamamlandi { background: #dcfce7; color: #166534; }
  .badge-iptal { background: #fee2e2; color: #991b1b; }
  .status-select { border: 1.5px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: inherit; background: white; cursor: pointer; }

  /* FORMS */
  .prod-admin-form { background: var(--surface); border-radius: 12px; padding: 22px 20px; margin-bottom: 20px; border: 1.5px solid var(--border); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; font-weight: 500; color: var(--text-soft); letter-spacing: 0.06em; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea { border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; background: #fafbfb; color: var(--text); transition: border-color 0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--nav-bg); background: white; }
  .add-prod-btn { background: var(--nav-bg); color: white; border: none; border-radius: 8px; padding: 11px 24px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.2s; }
  .add-prod-btn:hover { background: var(--accent-hover); }
  .section-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; color: var(--text); letter-spacing: 0.02em; }

  /* TABLES */
  .prod-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); }
  .prod-table th { background: var(--bg); padding: 11px 14px; text-align: left; font-size: 11px; color: var(--text-soft); font-weight: 500; border-bottom: 1.5px solid var(--border); letter-spacing: 0.06em; text-transform: uppercase; }
  .prod-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .prod-table tr:last-child td { border-bottom: none; }
  .prod-table tr:hover td { background: #f9fbfb; }
  .edit-input { border: 1.5px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 80px; font-family: inherit; background: #fafbfb; }
  .edit-input:focus { outline: none; border-color: var(--nav-bg); }
  .save-btn { background: #ecfdf5; color: #065f46; border: 1.5px solid #a7f3d0; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: 500; margin-right: 4px; font-family: inherit; transition: background 0.15s; }
  .save-btn:hover { background: #d1fae5; }
  .del-btn { background: #fef2f2; color: #991b1b; border: 1.5px solid #fecaca; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .del-btn:hover { background: #fee2e2; }
  h2 { margin-bottom: 24px; font-size: 24px; font-weight: 500; letter-spacing: 0.02em; }
  .section-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; }
  .code-tag { font-family: monospace; background: #f0f5f6; padding: 3px 7px; border-radius: 4px; font-size: 11px; color: var(--text-soft); border: 1px solid var(--border); }
  .filter-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .filter-row select { border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-family: inherit; background: var(--surface); }

  /* USER TABLE */
  .user-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); }
  .user-table th { background: var(--bg); padding: 11px 14px; text-align: left; font-size: 11px; color: var(--text-soft); font-weight: 500; border-bottom: 1.5px solid var(--border); letter-spacing: 0.06em; text-transform: uppercase; }
  .user-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }

  /* SUCCESS / OVERLAYS */
  .success-overlay { display: none; position: fixed; inset: 0; background: rgba(26,46,53,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  .success-overlay.show { display: flex; }
  .success-box { background: #fff; border-radius: 16px; padding: 44px 40px; text-align: center; max-width: 340px; }
  .success-icon { font-size: 56px; margin-bottom: 16px; }
  .success-box h3 { font-size: 20px; font-weight: 500; margin-bottom: 10px; }
  .success-box p { color: var(--text-soft); font-size: 14px; margin-bottom: 20px; }
  .success-close { background: var(--nav-bg); color: white; border: none; border-radius: 8px; padding: 12px 32px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }

  /* ADMIN LOGIN */
  .login-wall { display: none; position: fixed; inset: 0; background: rgba(26,46,53,0.6); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  .login-wall.show { display: flex; }
  .login-box { background: #fff; border-radius: 16px; padding: 36px; max-width: 320px; width: 100%; }
  .login-box h3 { margin-bottom: 20px; font-size: 20px; font-weight: 500; color: var(--nav-bg); }
  .login-box input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 14px; font-size: 14px; margin-bottom: 10px; font-family: inherit; background: #fafbfb; }
  .login-box input:focus { outline: none; border-color: var(--nav-bg); }
  .login-btn-admin { width: 100%; background: var(--nav-bg); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .login-err { color: #e05252; font-size: 13px; margin-bottom: 8px; display: none; }

  /* MISC */
  .loading { text-align: center; padding: 60px; color: var(--text-soft); }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--nav-bg); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--nav-bg); color: white; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: 0 4px 16px rgba(43,103,119,0.25); }
  .toast.show { opacity: 1; }
  .no-orders { text-align: center; padding: 60px 20px; color: var(--text-soft); font-size: 16px; }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, getDocs, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0ueT4_i49iWnGE2gUv2dfh3UdNSLZzL4",
  authDomain: "flat-order.firebaseapp.com",
  projectId: "flat-order",
  storageBucket: "flat-order.firebasestorage.app",
  messagingSenderId: "420750510371",
  appId: "1:420750510371:web:ed32519ed7a0c20fe9e496"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

const ADMIN_PW = "1234"; // ← Admin şifresi
const ADMIN_EMAILS = ["doguhansezgin@gmail.com", "55onurberber@gmail.com"];

let currentUser = null;
let userProfile = null;
let adminLoggedIn = false;
let products = [];
let siteSettings = {};
let siteCategories = [];
let deliveryRoutes = [];
let allOrders = [];
let myOrders = [];
let cart = {};
let activeCat = 'Tümü';
let adminTab = 'orders';

// =====================
// HELPERS
// =====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showAuthErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function showAuthInfo(msg) {
  const el = document.getElementById('auth-info');
  el.textContent = msg;
  el.style.display = 'block';
}

// =====================
// AUTH TABS
// =====================
window.switchAuthTab = function(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-tab').forEach((t, i) => { if ((i===0&&tab==='login')||(i===1&&tab==='register')) t.classList.add('active'); });
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('auth-err').style.display = 'none';
  document.getElementById('auth-info').style.display = 'none';
}

// =====================
// AUTH
// =====================
window.doLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  if (!email || !pw) { showAuthErr('E-posta ve şifre gerekli.'); return; }
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) {
    const msgs = { 'auth/user-not-found': 'Bu e-posta ile kayıt bulunamadı.', 'auth/wrong-password': 'Şifre yanlış.', 'auth/invalid-credential': 'E-posta veya şifre hatalı.' };
    showAuthErr(msgs[e.code] || 'Giriş başarısız: ' + e.message);
  }
}

window.doRegister = async function() {
  const cafe = document.getElementById('reg-cafe').value.trim();
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pw = document.getElementById('reg-pw').value;
  if (!cafe || !name || !phone || !email || !pw) { showAuthErr('Tüm alanları doldurun.'); return; }
  if (pw.length < 6) { showAuthErr('Şifre en az 6 karakter olmalı.'); return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await updateProfile(cred.user, { displayName: cafe });
    await setDoc(doc(db, 'users', cred.user.uid), {
      uid: cred.user.uid, cafe, name, phone, email,
      createdAt: new Date().toISOString(),
      orderCount: 0, totalSpent: 0,
      approved: false
    });
    showAuthInfo('Kaydınız alındı! Yönetici onayından sonra giriş yapabileceksiniz. ');
  } catch(e) {
    const msgs = { 'auth/email-already-in-use': 'Bu e-posta zaten kayıtlı.', 'auth/weak-password': 'Şifre çok zayıf.' };
    showAuthErr(msgs[e.code] || 'Kayıt başarısız: ' + e.message);
  }
}

window.doGoogleLogin = async function() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    const userRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userRef);
    if (!snap.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        cafe: user.displayName || 'Yeni Şube',
        name: user.displayName || '',
        phone: user.phoneNumber || '',
        email: user.email,
        createdAt: new Date().toISOString(),
        orderCount: 0, totalSpent: 0,
        approved: false
      });
    }
  } catch(e) {
    showAuthErr('Google girişi başarısız: ' + e.message);
  }
}

window.doLogout = async function() {
  await signOut(auth);
  cart = {};
  updateCartBadge();
  document.getElementById('pending-screen').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

// =====================
// AUTH STATE
// =====================
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    // Profil yükle
    const snap = await getDoc(doc(db, 'users', user.uid));
    userProfile = snap.exists() ? snap.data() : { cafe: user.displayName || user.email, name: user.displayName || '' };

    // Nav güncelle
    const cafe = userProfile.cafe || user.displayName || user.email;
    document.getElementById('user-name-nav').textContent = cafe;
    document.getElementById('user-avatar').textContent = cafe.charAt(0).toUpperCase();

    // Admin butonu
    if (ADMIN_EMAILS.includes(user.email) || adminLoggedIn) {
      document.getElementById('btn-admin').style.display = 'inline-block';
    }

    // Kullanıcı onayı kontrolü
    if (userProfile && userProfile.approved === false) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'none';
      document.getElementById('pending-screen').style.display = 'flex';
      return;
    }

    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('pending-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    // Panel butonu - sadece adminApproved olanlar görsün
    if (ADMIN_EMAILS.includes(user.email) || userProfile?.adminApproved === true) {
      document.getElementById('btn-admin').style.display = 'inline-block';
    } else {
      document.getElementById('btn-admin').style.display = 'none';
    }

    startListeners();
    loadMyOrders();
    // Her zaman catalog'dan başla
    showView('catalog');
  } else {
    currentUser = null;
    userProfile = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

// =====================
// REALTIME LISTENERS
// =====================
let unsubProducts = null;
let unsubOrders = null;

function startListeners() {
  if (unsubProducts) unsubProducts();
  if (unsubOrders) unsubOrders();

  // Settings listener
  onSnapshot(doc(db, 'settings', 'main'), snap => {
    siteSettings = snap.exists() ? snap.data() : {};
  });
  onSnapshot(collection(db, 'categories'), snap => {
    siteCategories = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.order||0)-(b.order||0));
  });
  onSnapshot(collection(db, 'routes'), snap => {
    deliveryRoutes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  });

  unsubProducts = onSnapshot(collection(db, 'products'), snap => {
    products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCatalog();
    if (adminTab === 'products') renderAdminProducts();
    if (adminTab === 'stock') renderAdminStock();
  });

  unsubOrders = onSnapshot(query(collection(db, 'orders'), orderBy('createdAt', 'desc')), snap => {
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    myOrders = allOrders.filter(o => o.uid === currentUser?.uid);
    if (adminTab === 'orders') renderAdminOrders();
    renderMyOrders();
  });
}

async function loadMyOrders() {
  // gerçek zamanlı listener zaten hallediyor
}

// =====================
// NAV
// =====================
window.showView = function(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.getElementById('btn-' + v)?.classList.add('active');
  if (v === 'cart') renderCart();
  if (v === 'myorders') renderMyOrders();
}

window.showAdmin = function() {
  // Yetkisiz erişimi engelle
  if (!ADMIN_EMAILS.includes(currentUser?.email) && !userProfile?.adminApproved && !adminLoggedIn) {
    showView('catalog');
    return;
  }
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('view-admin').classList.add('active');
  document.getElementById('btn-admin').classList.add('active');
  renderAdminOrders();
}

window.renderCatalog = function() {
  const cats = ['Tümü', ...new Set(products.map(p => p.cat))];
  document.getElementById('cat-filter').innerHTML = cats.map(c =>
    `<button class="cat-btn ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
  const filtered = activeCat === 'Tümü' ? products : products.filter(p => p.cat === activeCat);
  if (filtered.length === 0) { document.getElementById('products-grid').innerHTML = `<div style="color:#aaa;padding:40px">Ürün bulunamadı.</div>`; return; }
  document.getElementById('products-grid').innerHTML = filtered.map(p => {
    const qty = cart[p.id] || 0;
    const s = p.stock ?? 999;
    const outOfStock = !p.unstocked && s <= 0;
    const lowStock = !p.unstocked && s > 0 && s <= 5;
    let stockBadge = '';
    if (!p.unstocked && outOfStock) stockBadge = `<div class="stock-badge out">Tükendi</div>`;
    else if (!p.unstocked && lowStock) stockBadge = `<div class="stock-badge low">Son ${s}</div>`;
    return `<div class="product-card ${outOfStock ? 'out-of-stock' : ''}">
      ${stockBadge}
      
      <div class="product-code">#${p.code || '---'}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-cat">${p.cat}</div>
      <div class="product-price">₺${p.price}</div>
      ${(outOfStock && !p.unstocked) ? `<button class="add-btn" disabled style="background:#ccc;cursor:not-allowed">Tükendi</button>` :
        qty === 0 ? `<button class="add-btn" onclick="addToCart('${p.id}')">+ Sepete Ekle</button>` :
        `<div class="qty-ctrl"><button onclick="decCart('${p.id}')">−</button><span>${qty}</span><button onclick="addToCart('${p.id}')">+</button></div>`
      }
    </div>`;
  }).join('');
  updateCartBadge();
}

window.setCat = function(c) { activeCat = c; renderCatalog(); }
window.addToCart = function(id) { cart[id] = (cart[id] || 0) + 1; renderCatalog(); updateCartBadge(); }
window.decCart = function(id) { cart[id] = (cart[id] || 1) - 1; if (cart[id] === 0) delete cart[id]; renderCatalog(); updateCartBadge(); }
function updateCartBadge() { document.getElementById('cart-count').textContent = Object.values(cart).reduce((a,b)=>a+b,0); }

window.renderCart = function() {
  updateCartBadge();
  const el = document.getElementById('cart-content');
  const keys = Object.keys(cart);
  if (keys.length === 0) { el.innerHTML = `<div class="cart-empty">Sepetiniz boş</div>`; return; }
  let total = 0;
  const items = keys.map(id => {
    const p = products.find(x => x.id == id); if (!p) return '';
    const sub = p.price * cart[id]; total += sub;
    return `<div class="cart-item">
      <span style="font-size:28px">${p.emoji||''}</span>
      <div class="cart-item-info">
        <div class="cart-item-name">${p.name} <span class="code-tag">#${p.code}</span></div>
        <div class="cart-item-price">
          KDV hariç: ₺${p.price} × ${cart[id]} = ₺${formatTRInt(p.price*cart[id])}
        </div>
        <div style="font-size:11px;color:var(--text-soft)">
          KDV (%${Math.round((p.vat??0.20)*100)}): ₺${formatTR(p.price*cart[id]*(p.vat??0.20))} &nbsp;|&nbsp; 
          <b>KDV dahil: ₺${formatTR(p.price*cart[id]*(1+(p.vat??0.20)))}</b>
        </div>
      </div>
      <div class="qty-ctrl">
        <button onclick="decCart('${p.id}');renderCart();">−</button>
        <span>${cart[id]}</span>
        <button onclick="addToCart('${p.id}');renderCart();">+</button>
      </div>
      <div class="cart-item-total">₺${sub}</div>
    </div>`;
  }).join('');

  const cafe = userProfile?.cafe || '';
  const name = userProfile?.name || '';
  const phone = userProfile?.phone || '';

  el.innerHTML = `${items}
    <div class="cart-summary">
      <h3>Sipariş Özeti</h3>
      ${keys.map(id => { 
        const p = products.find(x=>x.id==id); 
        if (!p) return '';
        const lineNet = p.price*cart[id];
        const lineVat = lineNet*(p.vat??0.20);
        return `<div class="summary-row">
          <span>${p.name} ×${cart[id]}</span>
          <span>₺${formatTR(lineNet)} <span style="font-size:11px;color:var(--text-soft)">(+₺${formatTR(lineVat)} KDV)</span></span>
        </div>`; 
      }).join('')}
      <div style="border-top:2px solid var(--border);margin-top:12px;padding-top:12px">
        <div class="summary-row"><span style="color:var(--text-soft)">Toplam (KDV Hariç)</span><span>₺${formatTR(total)}</span></div>
        <div class="summary-row"><span style="color:var(--text-soft)">Toplam KDV</span><span>₺${formatTR(Object.keys(cart).reduce((s,id)=>{const p=products.find(x=>x.id==id);return s+(p?p.price*cart[id]*(p.vat??0.20):0);},0))}</span></div>
        <div class="summary-row summary-total"><span>Genel Toplam</span><span>₺${formatTR(total+Object.keys(cart).reduce((s,id)=>{const p=products.find(x=>x.id==id);return s+(p?p.price*cart[id]*(p.vat??0.20):0);},0))}</span></div>
      </div>
      <div class="order-form" style="margin-top:16px">
        <div class="section-title">Sipariş Bilgileri</div>
        <input type="text" id="cafe-name" placeholder="Kafe / Şube adı *" value="${cafe}">
        <input type="text" id="contact-name" placeholder="Yetkili adı *" value="${name}">
        <input type="tel" id="contact-phone" placeholder="Telefon *" value="${phone}">
        <textarea id="order-note" placeholder="Not eklemek ister misiniz?"></textarea>
        <button class="submit-btn" id="submit-btn" onclick="submitOrder(${total})">Siparişi Gönder</button>
      </div>
    </div>`;
}

window.submitOrder = async function(total) {
  const cafe = document.getElementById('cafe-name').value.trim();
  const contact = document.getElementById('contact-name').value.trim();
  const phone = document.getElementById('contact-phone').value.trim();
  if (!cafe || !contact || !phone) { alert('Zorunlu alanları doldurun.'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Gönderiliyor...';
  const items = Object.keys(cart).map(id => { const p = products.find(x=>x.id==id); return { id: p.id, code: p.code, name: p.name, qty: cart[id], price: p.price }; });
  const orderNum = 'SP' + Date.now().toString().slice(-6);
  const totalVat = items.reduce((s, i) => {
    const p = products.find(x => x.id == i.id);
    return s + (i.price * i.qty * (p?.vat ?? 0.20));
  }, 0);
  const totalWithVat = total + totalVat;
  try {
    await addDoc(collection(db, 'orders'), {
      num: orderNum, uid: currentUser.uid, cafe, contact, phone,
      note: document.getElementById('order-note').value,
      items: items.map(i => {
        const p = products.find(x=>x.id==i.id);
        return {...i, vat: p?.vat??0.20, vatAmount: i.price*i.qty*(p?.vat??0.20)};
      }),
      total, totalVat, totalWithVat, status: 'bekliyor',
      createdAt: new Date().toISOString(),
      date: new Date().toLocaleString('tr-TR')
    });
    // Stok ve istatistikler tamamlandıya çekilince güncellenecek
    cart = {}; updateCartBadge();
    document.getElementById('success-msg').textContent = `${cafe} siparişiniz alındı! No: ${orderNum}`;
    document.getElementById('success-overlay').classList.add('show');
  } catch(e) {
    alert('Hata: ' + e.message);
    btn.disabled = false; btn.textContent = 'Siparişi Gönder';
  }
}

window.closeSuccess = function() {
  document.getElementById('success-overlay').classList.remove('show');
  showView('myorders');
}

window.updateOrderStatus = async function(id, status) {
  const order = allOrders.find(o => o.id === id);
  const prevStatus = order?.status;
  await updateDoc(doc(db, 'orders', id), { status });
  
  // Hazırlanıyora geçince stoksuz ürün alış fiyatı sor
  if (status === 'hazirlaniyor' && prevStatus === 'bekliyor' && order) {
    const unstockedItems = order.items.filter(i => {
      const p = products.find(x => x.id === i.id);
      return p && p.unstocked;
    });
    if (unstockedItems.length > 0) {
      showUnstockedCostModal(order, unstockedItems);
      return;
    }
  }

  // Tamamlandıya geçince stok düş
  if (status === 'tamamlandi' && prevStatus !== 'tamamlandi' && order) {
    await completeOrder(order);
  }
  
  // İptal edilince stok geri koy (tamamlanmış siparişten)
  if (status === 'iptal' && prevStatus === 'tamamlandi' && order) {
    for (const item of order.items) {
      const p = products.find(x => x.id === item.id);
      if (p) await updateDoc(doc(db, 'products', item.id), { stock: (p.stock||0) + item.qty });
    }
  }
  
  showToast('Durum güncellendi ✓');
}

async function completeOrder(order, unstockedCosts) {
  // Stoklu ürünlerden stok düş
  for (const item of order.items) {
    const p = products.find(x => x.id === item.id);
    if (p && !p.unstocked) {
      await updateDoc(doc(db, 'products', item.id), { stock: Math.max(0, (p.stock||0) - item.qty) });
    }
  }
  // Stoksuz ürünlerin alış fiyatlarını kaydet
  if (unstockedCosts) {
    const itemsWithCost = order.items.map(i => {
      const cost = unstockedCosts[i.id];
      return cost ? {...i, cost: parseFloat(cost)} : i;
    });
    await updateDoc(doc(db, 'orders', order.id), { status: 'tamamlandi', items: itemsWithCost });
  } else {
    await updateDoc(doc(db, 'orders', order.id), { status: 'tamamlandi' });
  }
  // Kullanıcı istatistikleri güncelle
  if (order.uid) {
    const uRef = doc(db, 'users', order.uid);
    const uSnap = await getDoc(uRef);
    if (uSnap.exists()) {
      const ud = uSnap.data();
      await updateDoc(uRef, { orderCount: (ud.orderCount||0)+1, totalSpent: (ud.totalSpent||0)+order.total });
    }
  }
  showToast('Sipariş tamamlandı ✓');
}

window.confirmUnstockedCosts = async function(orderId) {
  const costs = {};
  for (const item of _pendingUnstockedItems) {
    const val = document.getElementById('ucost-'+item.id)?.value;
    if (!val || isNaN(val)) { alert('Lütfen tüm alış fiyatlarını girin.'); return; }
    costs[item.id] = parseFloat(val);
  }
  const order = allOrders.find(o => o.id === orderId);
  if (!order) return;
  document.getElementById('unstocked-modal').remove();
  await completeOrder(order, costs);
}

function formatTR(num) {
  // Manuel format: binlik ayraç nokta, ondalık virgül
  const fixed = parseFloat(num).toFixed(2);
  const parts = fixed.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return parts[0] + ',' + parts[1];
}
function formatTRInt(num) {
  return String(Math.round(num)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

window.deleteOrder = async function(id, num) {
  if (!confirm(num + ' nolu siparişi silmek istediğinize emin misiniz?')) return;
  // Tamamlanmış siparişse stok geri koy
  const order = allOrders.find(o => o.id === id);
  if (order && order.status === 'tamamlandi') {
    for (const item of order.items) {
      const p = products.find(x => x.id === item.id);
      if (p) await updateDoc(doc(db, 'products', item.id), { stock: (p.stock||0) + item.qty });
    }
    // Kullanıcı istatistiklerini geri al
    if (order.uid) {
      const uRef = doc(db, 'users', order.uid);
      const uSnap = await getDoc(uRef);
      if (uSnap.exists()) {
        const ud = uSnap.data();
        await updateDoc(uRef, {
          orderCount: Math.max(0, (ud.orderCount||0) - 1),
          totalSpent: Math.max(0, (ud.totalSpent||0) - order.total)
        });
      }
    }
  }
  await deleteDoc(doc(db, 'orders', id));
  showToast('Sipariş silindi');
}

window.addStockEntry = async function(productId) {
  const qty = parseInt(document.getElementById('se-qty-'+productId).value);
  const cost = parseFloat(document.getElementById('se-cost-'+productId).value);
  if (!qty || !cost) { alert('Miktar ve alış fiyatı girin.'); return; }
  
  // Stok girişi kaydet
  await addDoc(collection(db, 'stockEntries'), {
    productId, qty, remaining: qty, cost,
    date: new Date().toISOString(),
    dateStr: new Date().toLocaleDateString('tr-TR')
  });
  
  // Ürünün mevcut stokunu güncelle
  const p = products.find(x => x.id === productId);
  const currentStock = p ? (p.stock || 0) : 0;
  await updateDoc(doc(db, 'products', productId), { stock: currentStock + qty });
  
  document.getElementById('se-qty-'+productId).value = '';
  document.getElementById('se-cost-'+productId).value = '';
  showToast('Stok girişi kaydedildi ✓');
}

// FIFO maliyet hesapla
async function calcFIFOCost(productId, qty) {
  const allSnap = await getDocs(collection(db, 'stockEntries'));
  const entries = allSnap.docs
    .map(d => ({id: d.id, ...d.data()}))
    .filter(e => e.productId === productId && (e.remaining ?? e.qty) > 0)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  
  let remaining = qty;
  let totalCost = 0;
  const breakdown = [];
  
  for (const entry of entries) {
    if (remaining <= 0) break;
    const take = Math.min(remaining, entry.remaining);
    totalCost += take * entry.cost;
    breakdown.push({ qty: take, cost: entry.cost });
    remaining -= take;
  }
  
  // Kalan stok yoksa son bilinen maliyetle tahmin et
  if (remaining > 0 && entries.length > 0) {
    const lastCost = entries[entries.length - 1].cost;
    totalCost += remaining * lastCost;
    breakdown.push({ qty: remaining, cost: lastCost, estimated: true });
  }
  
  return { totalCost, breakdown, avgCost: qty > 0 ? totalCost / qty : 0 };
}

window.deleteStockEntry = async function(entryId, qty, productId) {

  if (Object.keys(adminOrderCart).length === 0) { alert('Sepet boş.'); return; }
  const user = adminUsers.find(u => u.uid === uid);
  const items = Object.keys(adminOrderCart).map(id => { const p=products.find(x=>x.id==id); return {id:p.id,code:p.code,name:p.name,qty:adminOrderCart[id],price:p.price}; });
  const total = items.reduce((s,i)=>s+i.price*i.qty, 0);
  const totalVat = items.reduce((s, i) => {
    const p = products.find(x => x.id == i.id);
    return s + (i.price * i.qty * (p?.vat ?? 0.20));
  }, 0);
  const totalWithVat = total + totalVat;
  const orderNum = 'SP' + Date.now().toString().slice(-6);
  const note = document.getElementById('ao-note')?.value || '';
  const customDateVal = document.getElementById('ao-date')?.value;
  const orderDate = customDateVal ? new Date(customDateVal) : new Date();
  await addDoc(collection(db, 'orders'), {
    num: orderNum, uid, cafe: user.cafe, contact: user.name, phone: user.phone,
    note, items: items.map(i => {
      const p = products.find(x => x.id == i.id);
      return {...i, vat: p?.vat ?? 0.20, vatAmount: i.price * i.qty * (p?.vat ?? 0.20)};
    }), total, totalVat, totalWithVat, status: 'bekliyor',
    createdAt: orderDate.toISOString(),
    date: orderDate.toLocaleDateString('tr-TR'),
    addedByAdmin: true
  });
  // Kullanıcı istatistikleri güncelle
  const uRef = doc(db, 'users', uid);
  const uSnap = await getDoc(uRef);
  if (uSnap.exists()) {
    const ud = uSnap.data();
    await updateDoc(uRef, { orderCount: (ud.orderCount||0)+1, totalSpent: (ud.totalSpent||0)+total });
  }
  adminOrderCart = {};
  showToast(`${user.cafe} için sipariş oluşturuldu ✓`);
  renderAdminNewOrderUI();
}

window.addUserByAdmin = async function() {
  const cafe = document.getElementById('nu-cafe').value.trim();
  const name = document.getElementById('nu-name').value.trim();
  const phone = document.getElementById('nu-phone').value.trim();
  const email = document.getElementById('nu-email').value.trim();
  const pw = document.getElementById('nu-pw').value;
  const errEl = document.getElementById('nu-err');
  if (!cafe||!name||!email||!pw) { errEl.textContent='Zorunlu alanları doldurun.'; errEl.style.display='block'; return; }
  if (pw.length < 6) { errEl.textContent='Şifre en az 6 karakter olmalı.'; errEl.style.display='block'; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await updateProfile(cred.user, { displayName: cafe });
    await setDoc(doc(db, 'users', cred.user.uid), {
      uid: cred.user.uid, cafe, name, phone, email,
      createdAt: new Date().toISOString(),
      orderCount: 0, totalSpent: 0, addedByAdmin: true, approved: true
    });
    errEl.style.display = 'none';
    showToast(`${cafe} üyesi oluşturuldu ✓`);

    errEl.style.display = 'block';
  }
}

window.renderAdminReports = async function() {
  const el = document.getElementById('admin-reports');
  el.innerHTML = `<div class="loading"><div class="spinner"></div><br>Raporlar hesaplanıyor...</div>`;
  
  // Tüm stok girişlerini al
  const stockSnap = await getDocs(collection(db, 'stockEntries'));
  const stockEntries = stockSnap.docs.map(d => ({id: d.id, ...d.data()}));
  
  // Tamamlanan siparişler
  const completedOrders = allOrders.filter(o => o.status === 'tamamlandi');
  
  let totalRevenue = 0, totalCost = 0, totalProfit = 0;
  
  // Her sipariş için kar hesapla
  const orderReports = await Promise.all(completedOrders.map(async o => {
    let orderCost = 0;
    let orderRevenue = o.total;
    const itemDetails = [];
    
    for (const item of o.items) {
      const p = products.find(x => x.id === item.id);
      const itemRevenue = item.price * item.qty;
      let itemCost = 0;

      if (p && p.unstocked) {
        // Stoksuz ürün: sipariş üzerindeki cost alanını kullan
        itemCost = item.cost ? item.cost * item.qty : 0;
      } else {
        // Stoklu ürün: FIFO hesapla
        const fifo = await calcFIFOCost(item.id, item.qty);
        itemCost = fifo.totalCost;
      }

      const itemProfit = itemRevenue - itemCost;
      orderCost += itemCost;
      itemDetails.push({
        ...item,
        revenue: itemRevenue,
        cost: itemCost,
        profit: itemProfit,
        margin: itemRevenue > 0 ? ((itemProfit/itemRevenue)*100).toFixed(1) : 0,
        isUnstocked: p?.unstocked || false
      });
    }
    
    const orderProfit = orderRevenue - orderCost;
    totalRevenue += orderRevenue;
    totalCost += orderCost;
    totalProfit += orderProfit;
    
    return { ...o, orderCost, orderProfit, itemDetails };
  }));
  
  const margin = totalRevenue > 0 ? ((totalProfit/totalRevenue)*100).toFixed(1) : 0;
  
  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" style="color:#22c55e">₺${formatTRInt(totalRevenue)}</div><div class="stat-label">Toplam Ciro</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#ef4444">₺${formatTRInt(totalCost)}</div><div class="stat-label">Toplam Maliyet</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--accent)">₺${formatTRInt(totalProfit)}</div><div class="stat-label">Toplam Kar</div></div>
      <div class="stat-card"><div class="stat-num">%${margin}</div><div class="stat-label">Kar Marjı</div></div>
    </div>
    
    ${orderReports.length === 0 ? '<div class="no-orders">Henüz tamamlanan sipariş yok</div>' :
      orderReports.map(o => `
        <div class="order-card tamamlandi" style="margin-bottom:16px">
          <div class="order-meta">
            <div><span class="order-num">${o.num}</span> <span class="status-badge badge-tamamlandi">Tamamlandı</span></div>
            <div class="order-date">${o.date}</div>
          </div>
          <div style="font-weight:500;font-size:13px;color:#444;margin-bottom:10px">${o.cafe}</div>
          
          <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px">
            <thead>
              <tr style="background:var(--surface)">
                <th style="padding:8px;text-align:left;border-radius:6px 0 0 6px">Ürün</th>
                <th style="padding:8px;text-align:right">Adet</th>
                <th style="padding:8px;text-align:right">Satış</th>
                <th style="padding:8px;text-align:right">Maliyet</th>
                <th style="padding:8px;text-align:right;border-radius:0 6px 6px 0">Kar</th>
              </tr>
            </thead>
            <tbody>
              ${o.itemDetails.map(i => `
                <tr style="border-bottom:1px solid var(--border)">
                  <td style="padding:8px">${i.name}</td>
                  <td style="padding:8px;text-align:right">${i.qty}</td>
                  <td style="padding:8px;text-align:right">₺${formatTRInt(i.revenue)}</td>
                  <td style="padding:8px;text-align:right;color:#ef4444">₺${formatTRInt(i.cost)}</td>
                  <td style="padding:8px;text-align:right;font-weight:500;color:${i.profit>=0?'#22c55e':'#ef4444'}">₺${formatTRInt(i.profit)} <span style="font-size:10px;color:var(--text-soft)">(${i.margin}%)</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
          
          <div style="display:flex;justify-content:space-between;padding:10px;background:var(--surface);border-radius:8px;font-weight:700">
            <span>Sipariş Karı</span>
            <span style="color:${o.orderProfit>=0?'#22c55e':'#ef4444'}">₺${formatTRInt(o.orderProfit)} <span style="font-size:12px;font-weight:400;color:var(--text-soft)">(${o.total>0?((o.orderProfit/o.total)*100).toFixed(1):0}% marj)</span></span>
          </div>
        </div>`).join('')
    }`;
}

            <div>

              <div style="display:flex;gap:8px">
                <input id="min-order" type="number" value="${siteSettings.minOrder||''}" placeholder="0" style="flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fafbfb">
                <button onclick="saveMinOrder()" style="padding:9px 16px;background:var(--nav-bg);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Kaydet</button>
              </div>
            </div>
            <div>
              <label style="font-size:12px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:6px">Varsayılan KDV Oranı</label>
              <select onchange="saveSetting('defaultVat', this.value)" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fafbfb">
                <option value="0.20" ${(siteSettings.defaultVat||'0.20')==='0.20'?'selected':''}>%20</option>
                <option value="0.10" ${siteSettings.defaultVat==='0.10'?'selected':''}>%10</option>
                <option value="0.01" ${siteSettings.defaultVat==='0.01'?'selected':''}>%1</option>
              </select>
            </div>
          </div>
        </div>

      </div>

      <div style="display:flex;flex-direction:column;gap:16px">

        <div class="prod-admin-form">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div class="section-title" style="margin-bottom:0">Teslimat Rotaları</div>
            <div onclick="toggleSetting('routesActive')" style="display:flex;align-items:center;gap:8px;padding:7px 14px;background:${siteSettings.routesActive?'var(--accent)':'#ccc'};color:white;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background 0.2s;user-select:none">
              ${siteSettings.routesActive ? 'Aktif' : 'Pasif'}
            </div>
          </div>
          ${siteSettings.routesActive 
            ? '<div style="font-size:12px;color:var(--accent);margin-bottom:12px;padding:8px 12px;background:#f0fdf9;border-radius:6px;border:1px solid #a7f3d0">Müşteri sipariş ekranında teslimat günü seçimi görünür</div>' 
            : '<div style="font-size:12px;color:var(--text-soft);margin-bottom:12px;padding:8px 12px;background:var(--bg);border-radius:6px">Pasif — müşteri teslimat günü seçimi görmez</div>'}

          <div style="background:var(--bg);border-radius:8px;padding:14px;margin-bottom:12px;border:1.5px solid var(--border)">
            <div style="font-size:13px;font-weight:600;margin-bottom:10px">Yeni Rota Ekle</div>
            <input id="new-route-name" placeholder="Rota adı (örn: Çarşamba Rotası)" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;background:white;margin-bottom:8px;box-sizing:border-box">
            <input id="new-route-region" placeholder="Bölge (örn: Çarşamba, Terme)" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;background:white;margin-bottom:8px;box-sizing:border-box">
            <div style="font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em">Teslimat Günleri</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
              ${days.map(d => `<label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;padding:5px 10px;border:1.5px solid var(--border);border-radius:6px;background:white"><input type="checkbox" id="nd-${d}" style="cursor:pointer"> ${d}</label>`).join('')}
            </div>
            <button onclick="addRoute()" style="width:100%;padding:9px;background:var(--nav-bg);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Rota Ekle</button>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px">
            ${deliveryRoutes.map(r => `
              <div style="padding:12px 14px;background:var(--bg);border-radius:8px;border:1.5px solid var(--border)">
                <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
                  <div>
                    <div style="font-size:14px;font-weight:600">${r.name}</div>
                    ${r.region ? `<div style="font-size:12px;color:var(--text-soft)">${r.region}</div>` : ''}
                  </div>
                  <button onclick="deleteRoute('${r.id}')" style="padding:4px 8px;background:#fef2f2;color:#991b1b;border:1.5px solid #fecaca;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit">Sil</button>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:4px">
                  ${(r.days||[]).map(d => `<span style="padding:3px 9px;background:var(--border-dark);border-radius:4px;font-size:11px;font-weight:500">${d}</span>`).join('')}
                </div>
              </div>`).join('')}
            ${deliveryRoutes.length === 0 ? '<div style="color:var(--text-soft);font-size:13px;padding:10px">Henüz rota eklenmedi</div>' : ''}
          </div>
        </div>

      </div>
    </div>`;
}

window.addCategory = async function() {
  const name = document.getElementById('new-cat-name').value.trim();
  if (!name) return;
  if (siteCategories.find(c => c.name === name)) { showToast('Bu kategori zaten var'); return; }
  await addDoc(collection(db, 'categories'), { name, order: siteCategories.length, deliveryDays: null });
  document.getElementById('new-cat-name').value = '';
  showToast('Kategori eklendi');
}

window.deleteCategory = async function(id) {
  if (!confirm('Bu kategori silinsin mi?')) return;
  await deleteDoc(doc(db, 'categories', id));
  showToast('Kategori silindi');
}

window.updateCategoryDelivery = async function(id, val) {
  const days = val ? parseInt(val) : null;
  await updateDoc(doc(db, 'categories', id), { deliveryDays: days });
  showToast('Teslim süresi kaydedildi');
}

window.toggleSetting = async function(key) {
  const current = siteSettings[key] || false;
  await setDoc(doc(db, 'settings', 'main'), { [key]: !current }, { merge: true });
  siteSettings[key] = !current;
  showToast((!current ? 'Aktif' : 'Pasif') + ' edildi');
  renderAdminSettings();
}

window.saveSetting = async function(key, val) {
  await setDoc(doc(db, 'settings', 'main'), { [key]: val }, { merge: true });
  siteSettings[key] = val;
  showToast('Kaydedildi');
}

window.saveNotifEmail = async function() {
  const email = document.getElementById('notif-email').value.trim();
  if (!email) return;
  await setDoc(doc(db, 'settings', 'main'), { notifEmail: email }, { merge: true });
  siteSettings.notifEmail = email;
  showToast('Mail adresi kaydedildi');
}

window.saveMinOrder = async function() {
  const val = parseFloat(document.getElementById('min-order').value) || 0;
  await setDoc(doc(db, 'settings', 'main'), { minOrder: val }, { merge: true });
  siteSettings.minOrder = val;
  showToast('Minimum tutar kaydedildi');
}

window.addRoute = async function() {
  const name = document.getElementById('new-route-name').value.trim();
  const region = document.getElementById('new-route-region').value.trim();
  const allDays = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
  const days = allDays.filter(d => document.getElementById('nd-'+d)?.checked);
  if (!name || days.length === 0) { alert('Rota adı ve en az bir gün seçin.'); return; }
  await addDoc(collection(db, 'routes'), { name, region, days, createdAt: new Date().toISOString() });
  showToast('Rota eklendi');
}

window.deleteRoute = async function(id) {
  if (!confirm('Bu rota silinsin mi?')) return;
  await deleteDoc(doc(db, 'routes', id));
  showToast('Rota silindi');
}

</script>
</body>
</html>
